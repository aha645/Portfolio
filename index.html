<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포트폴리오</title>
  <!-- 마크업·스타일·스크립트의 설계 의도는 docs/ARCHITECTURE.md 참고 -->
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js" defer></script>
  <script src="js/script.js" defer></script>
</head>
<body>
  <!-- 헤더 · 네비게이션 -->
  <header id="site-header">
    <nav>
      <a href="#hero" class="logo">MyPortfolio</a>

      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="다크 모드 전환">🌙</button>

      <button id="hamburger" class="hamburger" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="nav-menu">
        <span></span><span></span><span></span>
      </button>

      <ul id="nav-menu">
        <li><a href="#hero" class="nav-link">홈</a></li>
        <li><a href="#about" class="nav-link">소개</a></li>
        <li><a href="#skills" class="nav-link">기술</a></li>
        <li><a href="#projects" class="nav-link">프로젝트</a></li>
        <li><a href="#contact" class="nav-link">문의</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- Hero -->
    <section id="hero" class="reveal">
      <h1 id="hero-greeting"></h1>
      <a id="hero-cta" class="btn" href="#projects">버튼</a>
    </section>

    <!-- About -->
    <section id="about" class="reveal">
      <h2>소개</h2>
      <img id="about-img" src="" alt="프로필 사진을 불러오는 중입니다" />
      <p id="about-text"></p>
    </section>

    <!-- Skills -->
    <section id="skills" class="reveal">
      <h2>기술 스택</h2>
      <ul id="skills-list"></ul>
    </section>

    <!-- Projects (GitHub API) -->
    <section id="projects" class="reveal">
      <h2>프로젝트</h2>
      <div id="projects-filters" class="filters"></div>
      <div id="projects-status" class="status-msg" aria-live="polite"></div>
      <div id="projects-list"></div>
    </section>

    <!-- Contact -->
    <section id="contact" class="reveal">
      <h2>문의하기</h2>
      <form id="contact-form" novalidate>
        <div class="form-group">
          <label for="name">이름</label>
          <input type="text" id="name" name="name" />
          <span class="error-message" id="name-error"></span>
        </div>

        <div class="form-group">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" />
          <span class="error-message" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="message">메시지</label>
          <textarea id="message" name="message"></textarea>
          <span class="error-message" id="message-error"></span>
        </div>

        <button type="submit" id="contact-submit" class="btn">보내기</button>
        <p id="form-status" role="status"></p>
      </form>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p id="footer-copyright"></p>
    <ul id="footer-social"></ul>
  </footer>

  <!-- 맨 위로 버튼 -->
  <button id="scroll-top" class="scroll-top" type="button" aria-label="맨 위로 이동">↑</button>
</body>
</html>
