<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포트폴리오</title>
  <link rel="stylesheet" href="css/style.css" />
  <!--
    script를 head에서 defer로 불러오는 이유:
    - defer는 HTML 파싱을 막지 않고, 파싱이 끝난 뒤(DOM이 준비된 뒤) 실행되므로
      body 끝에 <script>를 두는 것과 실행 시점은 비슷하지만
      "다운로드는 파싱과 동시에, 실행은 파싱 후"라 body 하단에 두는 것보다 효율적이다.
    - 과제 요구사항: "JavaScript 파일을 defer 속성으로 연결한다."
  -->
  <script src="js/script.js" defer></script>
</head>
<body>
  <!--
    헤더 + 네비게이션 (Flexbox: 로고 왼쪽 / 메뉴+토글 오른쪽)
    [HTML ↔ JS 대응] id="site-header" → js가 window의 scroll 이벤트를 듣다가
    스크롤이 60px(NAV_SCROLL_THRESHOLD)을 넘으면 이 <header>에 classList.toggle('scrolled')로
    클래스를 붙인다.
    [HTML ↔ CSS 대응] `header.scrolled`(style.css) 규칙이 box-shadow를 더 진하게 바꿔
    "스크롤하면 헤더가 화면 위로 살짝 떠오른 듯한" 느낌을 준다. header 자체는
    position:sticky + top:0이라 스크롤해도 항상 화면 상단에 고정된다(이건 JS 없이
    CSS만으로 동작).
  -->
  <header id="site-header">
    <nav>
      <!--
        [HTML ↔ CSS 대응] class="logo" → css/style.css의 `.logo` 규칙(92번째 줄 부근)이
        font-weight:bold, margin-right:auto 를 적용한다.
        nav는 display:flex + justify-content:space-between인데, 이 로고에 걸린
        margin-right:auto가 "나머지 여유 공간을 전부 왼쪽에서 흡수"해버려서
        결과적으로 로고는 nav 맨 왼쪽에 붙고, 뒤따르는 다크모드 버튼·햄버거·메뉴는
        하나로 뭉쳐 오른쪽 끝에 배치되는 화면이 만들어진다.
        (JS는 이 요소를 건드리지 않는, 순수 CSS 레이아웃 요소다.)
      -->
      <a href="#hero" class="logo">MyPortfolio</a>

      <!--
        [HTML ↔ CSS 대응] class="theme-toggle" → css의 `.theme-toggle` 규칙이
        36px 원형 아이콘 버튼 모양(테두리+border-radius:50%)을 만든다.
        [HTML ↔ JS 대응] id="theme-toggle" → js/script.js가 이 버튼의 click 이벤트를 듣고
        setState({ theme: ... })로 STATE.theme을 바꾼다. 그러면 renderTheme()이 <html>의
        data-theme 속성을 "light" ↔ "dark"로 바꾸며 버튼 안의 이모지(🌙/☀️) 텍스트도 함께 바꾼다.
        화면에서는: 버튼을 누를 때마다 아이콘이 바뀌고 전체 배경/글자색이 부드럽게 전환된다.
      -->
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="다크 모드 전환">🌙</button>

      <!--
        [HTML ↔ CSS 대응] class="hamburger" → css의 `.hamburger`(3개의 span을 세로로 쌓은
        "≡" 모양) 규칙과, 768px 이상에서는 `display:none`으로 숨기는 미디어쿼리가 적용된다.
        [HTML ↔ JS 대응] id="hamburger" → js/script.js가 click 이벤트를 듣고
        #nav-menu(아래 ul)에 classList.toggle('active')를 실행해 드롭다운 메뉴를 열고 닫는다.
        동시에 이 버튼 자신에도 .active를 토글해 CSS가 3개의 span을 "X" 모양으로 회전시키고,
        aria-expanded 값도 true/false로 맞춰 스크린리더에 열림 상태를 알린다.
        화면에서는: 모바일 폭에서만 보이며, 누르면 "≡"가 "X"로 바뀌고 메뉴가 아래로 펼쳐진다.
      -->
      <button id="hamburger" class="hamburger" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="nav-menu">
        <span></span><span></span><span></span>
      </button>

      <!--
        [HTML ↔ JS 대응] id="nav-menu" → 햄버거 버튼 click 시 js가 이 ul에 .active를 토글한다.
        [HTML ↔ CSS 대응] 이 ul 자체는 별도 class 없이 `nav ul` 태그 선택자로 스타일링된다.
        모바일 기본값은 display:none(숨김) + position:absolute(드롭다운),
        `nav ul.active`가 되면 display:flex로 보이고,
        768px 이상 미디어쿼리에서는 position:static + display:flex로 강제되어
        JS의 .active 여부와 무관하게 항상 가로로 펼쳐진 메뉴로 보인다.
      -->
      <ul id="nav-menu">
        <!--
          [HTML ↔ CSS 대응] class="nav-link"는 CSS에서 직접 선택하는 클래스가 아니다.
          실제 링크 스타일(색상, hover 시 강조색)은 태그 선택자인 `nav a`가 담당한다.
          [HTML ↔ JS 대응] class="nav-link"는 오직 js가
          document.querySelectorAll('.nav-link')로 이 5개 링크를 한 번에 찾아
          클릭 시 preventDefault() 후 scrollIntoView({behavior:'smooth'})로
          부드럽게 스크롤 이동시키기 위한 "JS 전용 훅(hook)" 역할만 한다.
        -->
        <li><a href="#hero" class="nav-link">홈</a></li>
        <li><a href="#about" class="nav-link">소개</a></li>
        <li><a href="#skills" class="nav-link">기술</a></li>
        <li><a href="#projects" class="nav-link">프로젝트</a></li>
        <li><a href="#contact" class="nav-link">문의</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!--
      [HTML ↔ CSS·JS 대응] class="reveal"은 이 페이지의 모든 <section>에 공통으로 붙어 있다.
      - CSS(.reveal / .reveal.visible, style.css 13-2번)가 "opacity:0 + 아래로 30px 이동"한
        기본 상태와, "opacity:1 + 제자리"로 돌아오는 전환(transition)을 정의한다.
      - JS(observeReveal()가 만드는 IntersectionObserver)는 이 섹션이 뷰포트에 20%
        이상 들어오는 순간 감지해서 .visible 클래스만 "붙여주는" 역할을 한다.
      즉 "무엇을(애니메이션 값) 어떻게(전환 곡선)"는 CSS가, "언제(스크롤 위치)"는 JS가
      담당하는 전형적인 CSS+JS 협업 패턴이다. 아래 About/Skills/Projects/Contact
      섹션에도 동일하게 적용되므로 개별 섹션에서는 반복 설명하지 않는다.
    -->
    <!-- Hero 섹션 -->
    <section id="hero" class="reveal">
      <!--
        [HTML ↔ JS 대응] id="hero-greeting", id="hero-cta"는 CSS로는 텍스트를 만들지 않는
        "빈 껍데기"다. js/script.js가 DOMContentLoaded 시점에 data/info.json을 fetch해서
        hero.greeting → <h1>의 textContent, hero.ctaText/ctaLink → <a>의
        textContent/href로 채워 넣는다. 즉 화면에 보이는 실제 문구는 HTML이 아니라
        data/info.json에 들어있고, HTML은 그 값이 들어갈 "자리"만 잡아둔 것이다.
        [HTML ↔ CSS 대응] #hero-cta는 button과 같은 그룹으로 묶여
        `#hero-cta, button:not(...)` 규칙(style.css 214번 부근)의 적용을 받아
        파란 배경의 알약 모양 버튼으로 보이고, hover 시 위로 살짝 떠오른다.
      -->
      <h1 id="hero-greeting"></h1>
      <a id="hero-cta" href="#projects">버튼</a>
    </section>

    <!-- About 섹션 -->
    <section id="about" class="reveal">
      <h2>소개</h2>
      <!--
        [HTML ↔ JS 대응] id="about-img"/"about-text" → js가 info.json의 about.image,
        about.imageAlt(의미있는 alt 속성), about.text 값을 각각 img.src/img.alt/
        p.textContent에 채운다.
        [HTML ↔ CSS 대응] #about-img는 CSS에서 width/height:150px + border-radius:50% +
        object-fit:cover가 적용되어, JS가 어떤 크기의 사진을 넣어도 항상 150px 정원(正圓)
        프로필 사진으로 잘려 보인다 (JS는 값만 넣고, 모양은 전적으로 CSS가 결정한다).
      -->
      <img id="about-img" src="" alt="" />
      <p id="about-text"></p>
    </section>

    <!-- Skills 섹션 -->
    <section id="skills" class="reveal">
      <h2>기술 스택</h2>
      <!--
        [HTML ↔ JS 대응] id="skills-list" → js가 info.json의 skills 배열을 forEach로 순회하며
        <li> 태그를 하나씩 만들어 이 <ul> 안에 appendChild한다 (최초에는 빈 리스트).
        [HTML ↔ CSS 대응] JS가 만든 <li>들은 부모 #skills-list의 `display:flex;
        flex-wrap:wrap`(style.css 10번) 덕분에 태그처럼 가로로 나열되다가 줄이 넘치면
        자동으로 다음 줄로 내려가고, 각 <li>는 `#skills-list li` 규칙으로 카드형 배지
        모양(배경색+테두리+둥근 모서리)을 갖는다.
      -->
      <ul id="skills-list"></ul>
    </section>

    <!-- Projects 섹션 (GitHub API) -->
    <section id="projects" class="reveal">
      <h2>프로젝트</h2>
      <!--
        [HTML ↔ JS 대응] id="projects-status" → js의 loadProjects()가 fetch 상태에 따라
        setState({ projects: {...} })로 STATE.projects.status를 바꾸고, renderProjects()가
        이 div의 innerHTML을 통째로 교체한다: 로딩 중엔 "로딩 중..." 문구,
        실패하면 에러 문구+"다시 시도" 버튼, 결과가 0개면 "표시할 프로젝트가 없습니다",
        성공하면 빈 문자열("")을 넣어 이 영역 자체를 비운다.
        aria-live="polite"는 스크린리더 사용자에게도 이 상태 변화가 자동으로 읽히게 한다.
        [HTML ↔ CSS 대응] class="status-msg"는 가운데 정렬 + 내부 여백을 주고,
        `.status-msg:empty { display:none }` 덕분에 JS가 빈 문자열을 넣는 성공 상태에서는
        이 영역이 화면에서 아예 사라진다 (JS가 display를 직접 건드리지 않아도 CSS의
        :empty 가상클래스가 자동으로 숨겨준다).
      -->
      <div id="projects-status" class="status-msg" aria-live="polite"></div>
      <!--
        [HTML ↔ JS 대응] id="projects-list" → js의 renderProjects()가 GitHub API 응답을
        map()으로 <article class="project-card reveal"> 카드 HTML 문자열 배열로 바꾼 뒤
        join('')해서 이 div의 innerHTML에 한 번에 삽입한다. 최초 로드 시에는 비어있다.
        [HTML ↔ CSS 대응] 이 그리드 레이아웃은 class가 아니라 id 선택자
        `#projects-list`(style.css 11번, display:grid; grid-template-columns:
        repeat(auto-fit, minmax(280px, 1fr)))가 담당한다. 그래서 이 div에는 별도의
        `class`를 붙이지 않았다 — 붙여도 대응하는 CSS 규칙이 없어 아무 효과가 없기 때문이다.
        JS가 삽입하는 각 <article>은 `#projects-list article` 규칙으로 카드 모양
        (그림자+hover 시 위로 떠오르는 효과)을 자동으로 물려받는다.
      -->
      <div id="projects-list"></div>
    </section>

    <!-- Contact 섹션 -->
    <section id="contact" class="reveal">
      <h2>문의하기</h2>
      <!--
        novalidate: 브라우저 기본 유효성 검사 팝업 대신
        JS로 직접 검증하고 에러 메시지를 필드 근처에 표시하기 위함.
      -->
      <!--
        [HTML ↔ JS 대응] id="contact-form" → js의 initContactForm()이 submit 이벤트를 듣고
        preventDefault()로 새로고침을 막은 뒤, 아래 3개 필드를 모두 검증한다.
        input 태그의 id(name/email/message)는 label의 for와 1:1로 매칭되어 있고
        (label 클릭 시 해당 입력창에 포커스가 가는 접근성 기능), js는 이 id로
        document.getElementById()를 통해 각 입력값을 읽는다.
      -->
      <form id="contact-form" novalidate>
        <div class="form-group">
          <label for="name">이름</label>
          <input type="text" id="name" name="name" />
          <!--
            [HTML ↔ JS 대응] id="name-error" → js의 setFieldError()가 값이 비어 있으면
            이 span의 textContent에 "필수 입력 항목입니다."를 넣고, 통과하면 다시 ""로 비운다.
            [HTML ↔ CSS 대응] class="error-message"는 항상 존재하는 빨간 글자 스타일이며,
            min-height:1em이 걸려 있어 메시지가 비어 있어도 자리(높이)는 유지된다
            → 에러가 나타났다 사라졌다 할 때 아래 요소들이 덜컹거리며 밀리지 않게 하기 위함.
          -->
          <span class="error-message" id="name-error"></span>
        </div>

        <div class="form-group">
          <label for="email">이메일</label>
          <input type="email" id="email" name="email" />
          <!-- id="email-error": name-error와 동일하게 동작 + 정규식으로 이메일 형식도 검사 -->
          <span class="error-message" id="email-error"></span>
        </div>

        <div class="form-group">
          <label for="message">메시지</label>
          <textarea id="message" name="message"></textarea>
          <!-- id="message-error": name-error와 동일한 필수값 검사만 적용 -->
          <span class="error-message" id="message-error"></span>
        </div>

        <button type="submit">보내기</button>
        <!--
          [HTML ↔ JS 대응] id="form-success" → 3개 필드가 모두 통과했을 때만 js가
          이 <p>의 textContent에 성공 문구를 넣고 form.reset()으로 입력값을 초기화한다.
          role="status"는 aria-live="polite"와 비슷하게 스크린리더에 자동으로 읽히게 한다.
        -->
        <p id="form-success" class="success-message" role="status"></p>
      </form>
    </section>
  </main>

  <!--
    Footer
    [HTML ↔ JS 대응] id="footer-copyright"/"footer-social" → js가 info.json의
    footer.copyright를 <p>의 textContent로, footer.social 배열을 forEach로 순회하며
    <li><a>...</a></li>를 만들어 <ul>에 appendChild한다.
    [HTML ↔ CSS 대응] #footer-social은 `display:flex; justify-content:center`로
    JS가 만든 소셜 링크들을 가운데 가로 정렬한다.
  -->
  <footer>
    <p id="footer-copyright"></p>
    <ul id="footer-social"></ul>
  </footer>

  <!--
    [HTML ↔ CSS 대응] class="scroll-top" → css의 `.scroll-top` 규칙이 이 버튼을
    화면 우하단에 고정(position:fixed)시키고, 기본 상태는 opacity:0 + visibility:hidden으로
    "보이지도 클릭되지도 않게" 숨겨둔다.
    [HTML ↔ JS 대응] id="scroll-top" → js가 window의 scroll 이벤트를 듣다가
    스크롤이 300px(SCROLL_TOP_THRESHOLD)을 넘으면 이 버튼에 classList.toggle('show')로
    `.show` 클래스를 붙인다 → css의 `.scroll-top.show`가 opacity:1로 바꿔 서서히
    나타나게 한다. 버튼 클릭 시에는 js가 window.scrollTo({top:0, behavior:'smooth'})로
    페이지 맨 위로 부드럽게 스크롤시킨다.
  -->
  <button id="scroll-top" class="scroll-top" type="button" aria-label="맨 위로 이동">↑</button>
</body>
</html>
